{{ define "content" }}
<div class="space-y-8">
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Upload Fee Payments CSV</h2>
        
        <form hx-post="/api/v1/payments/csv" hx-encoding="multipart/form-data" class="flex space-x-4 items-end">
            <div class="flex-grow">
                <label class="block text-sm font-medium text-gray-700 mb-1">CSV File</label>
                <input type="file" name="file" accept=".csv" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-md">
            </div>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md h-[42px]">
                Upload & Process
            </button>
        </form>
    </div>
</div>
{{ end }}
{{ template "layout" . }}
